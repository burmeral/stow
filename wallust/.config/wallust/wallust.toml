# ~/.config/wallust/modules/wallust.toml

# Backend

# full - resized - wal - thumb -  fastresize - kmeans

backend = "fastresize"

# Colorspace

# lab - labmixed - lch - lchmixed - salience

color_space = "salience"

# Palette

# dark - dark16 - darkcomp - darkcomp16
# light - light16 - lightcomp - lightcomp16
# harddark - harddark16 - harddarkcomp - harddarkcomp16
# softdark - softdark16 - softdarkcomp - softdarkcomp16
# softlight - softlight16 - softlightcomp - softlightcomp16
# saliencedark - saliencedarkbalanced - saliencedarkdistributed - saliencedarklow (each has the 16 variations)
# salienceligh - saliencelightbalanced - saliencelightdistributed - saliencelightlow (each has the 16 variations)

palette = "softlight"

# Contrast

# Ensures a "readable contrast" 

#check_contrast = true

# Saturation

# Color saturation, between [1% and 100%] 

saturation = 50

# Templates

[templates.kitty]
template = "kitty/kitty.conf"
target = "~/.config/kitty/colors.conf"

[templates.gtk3]
template = "gtk-3.0/gtk.css"
target = "~/.config/gtk-3.0/gtk.css"

[templates.gtk4]
template = "gtk-4.0/gtk.css"
target = "~/.config/gtk-4.0/gtk.css"

[templates.emacs]
template = "emacs/theme.el"
target = "~/.config/doom/generated-theme.el"

[templates.sys24]
template = "vesktop/system24.css"
target = "~/.config/vesktop/themes/system24.theme.css"

[templates.midnight]
template = "vesktop/midnight.css"
target = "~/.config/vesktop/themes/midnight.theme.css"

[templates.superfile]
template = "superfile/theme.toml"
target = "~/.config/superfile/themes/generated.toml"

[templates.nvim]
template = "nvim/colors.lua"
target = "~/.config/nvim/lua/colors.lua"

[templates.bookokrat]
template = "bookokrat/bookokrat.yaml"
target = "~/.config/bookokrat/generated-theme.yaml"

[templates.zathura]
template = "zathura/colors"
target = "~/.config/zathura/colors"

[hooks]

# Run commands when wallust is invoked. Useful to avoid scripting.

# wallpaper = """awww img "$(find ~/Assets/Homescreen/current -iregex '.*.\\(jpg\\|jpeg\\|png\\|gif\\)' -type f | shuf -n 1)" """

bookokrat = "~/.config/wallust/scripts/bookokrat.sh"
